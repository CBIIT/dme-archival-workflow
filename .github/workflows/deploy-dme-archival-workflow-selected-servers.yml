name: Deploy DME Archival Workflow to Selected Servers

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        default: prod
        options:
          - prod
      build_run_number:
        description: "Build workflow run number that produced dme-archival-workflow-artifacts"
        required: true
        type: string
      fsdmel_wflow05p_ncifcrf_gov:
        description: "Deploy to fsdmel-wflow05p.ncifcrf.gov"
        required: false
        type: boolean
        default: false
      fsdmel_wflow04p_ncifcrf_gov:
        description: "Deploy to fsdmel-wflow04p.ncifcrf.gov"
        required: false
        type: boolean
        default: false

run-name: "Deploy DME Archival Workflow from build ${{ inputs.build_run_id }} to ${{ inputs.environment }}"

jobs:
  prepare:
    name: Prepare selected server matrix
    runs-on:
      group: cbiit-global-runners
      labels: [self-hosted]
    outputs:
      matrix: ${{ steps.selected_servers.outputs.matrix }}
    steps:
      - name: Build selected server matrix
        id: selected_servers
        shell: bash
        run: |
          set -euo pipefail

          matrix='{"include":['
          separator=''

          add_server() {
            local name="$1"
            local host="$2"
            matrix="${matrix}${separator}{\"name\":\"${name}\",\"host\":\"${host}\"}"
            separator=','
          }

          if [ "${{ inputs.fsdmel_wflow05p_ncifcrf_gov }}" = "true" ]; then
            add_server "fsdmel-wflow05p.ncifcrf.gov" "fsdmel-wflow05p.ncifcrf.gov"
          fi

          if [ "${{ inputs.fsdmel_wflow04p_ncifcrf_gov }}" = "true" ]; then
            add_server "fsdmel-wflow04p.ncifcrf.gov" "fsdmel-wflow04p.ncifcrf.gov"
          fi

          matrix="${matrix}]}"

          if [ "$matrix" = '{"include":[]}' ]; then
            echo "Select at least one deployment server checkbox." >&2
            exit 1
          fi

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Selected server matrix: ${matrix}"

  deploy:
    name: Deploy to ${{ matrix.name }}
    needs: prepare
    runs-on:
      group: cbiit-global-runners
      labels: [self-hosted]
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      APP_NAME: dme-sync
      SERVICE_NAME: archival-workflow
      DEPLOY_DIR: /opt/hpcdm_workflows/deployments
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: Download build artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-dme-archival-workflow.yml
          run_number: ${{ inputs.build_run_number }}
          name: dme-archival-workflow-artifacts
          path: artifacts

      - name: List downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloaded artifacts:"
          find artifacts -maxdepth 5 -type f | sort

      - name: Set jar file environment
        id: jar
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(find artifacts -maxdepth 5 -type f -name 'dme-sync-*.jar' | sort)

          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No dme-sync-*.jar artifact found." >&2
            exit 1
          fi

          if [ "${#jars[@]}" -gt 1 ]; then
            echo "More than one dme-sync-*.jar artifact found; refusing to guess." >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi

          jar_path="${jars[0]}"
          jar_name="$(basename "$jar_path")"

          echo "JAR_PATH=${jar_path}" >> "$GITHUB_ENV"
          echo "JAR_NAME=${jar_name}" >> "$GITHUB_ENV"
          echo "jar_path=${jar_path}" >> "$GITHUB_OUTPUT"
          echo "jar_name=${jar_name}" >> "$GITHUB_OUTPUT"

          echo "JAR_PATH=${jar_path}"
          echo "JAR_NAME=${jar_name}"

      - name: Set up SSH
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SSH_USER" ]; then
            echo "DEPLOY_SSH_USER secret is required." >&2
            exit 1
          fi

          if [ -z "$SSH_KEY" ]; then
            echo "SSH_KEY secret is required." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          ssh_key_file="$HOME/.ssh/id_rsa"
          printf '%s\n' "$SSH_KEY" > "$ssh_key_file"
          chmod 600 "$ssh_key_file"
          ssh-keyscan -H "${{ matrix.host }}" >> ~/.ssh/known_hosts
          echo "SSH_KEY_FILE=${ssh_key_file}" >> "$GITHUB_ENV"

      - name: Stop service, back up old jar, and remove current symlink
        shell: bash
        run: |
          set -euo pipefail

          ssh -i "$SSH_KEY_FILE" -o IdentitiesOnly=yes "${SSH_USER}@${{ matrix.host }}" \
            "set -e; sudo systemctl stop ${SERVICE_NAME}; cd ${DEPLOY_DIR}; find . -maxdepth 1 -type f -name '${APP_NAME}-*.jar' -exec mv {} {}_backup_\$(date +%Y%m%d.%H%M) \; || exit \$?; rm -f ${APP_NAME}.jar"

      - name: Copy new jar to deployment directory
        shell: bash
        run: |
          set -euo pipefail

          scp -i "$SSH_KEY_FILE" -o IdentitiesOnly=yes -p \
            "$JAR_PATH" \
            "${SSH_USER}@${{ matrix.host }}:${DEPLOY_DIR}/${JAR_NAME}"

      - name: Create symlink and start service
        shell: bash
        run: |
          set -euo pipefail

          ssh -i "$SSH_KEY_FILE" -o IdentitiesOnly=yes "${SSH_USER}@${{ matrix.host }}" \
            "set -e; cd ${DEPLOY_DIR}; ln -sfn ${JAR_NAME} ${APP_NAME}.jar; sudo systemctl start ${SERVICE_NAME}"
