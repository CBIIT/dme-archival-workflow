name: Restart DME Archival Workflow to Selected Servers

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        default: prod
        options:
          - prod
      action:
        description: "Action to perform on the servers"
        required: true
        type: choice
        options:
          - restart
          - stop
          - start
      fsdmel_wflow02p_ncifcrf_gov:
        description: "Deploy to fsdmel-wflow02p.ncifcrf.gov"
        required: false
        type: boolean
        default: false
      fsdmel_wflow03p_ncifcrf_gov:
        description: "Deploy to fsdmel-wflow03p.ncifcrf.gov"
        required: false
        type: boolean
        default: false
      fsdmel_wflow04p_ncifcrf_gov:
        description: "Deploy to fsdmel-wflow04p.ncifcrf.gov"
        required: false
        type: boolean
        default: false
      fsdmel_wflow05p_ncifcrf_gov:
        description: "Deploy to fsdmel-wflow05p.ncifcrf.gov"
        required: false
        type: boolean
        default: false
      ncias_p2140_v_nci_nih_gov:
        description: "Deploy to ncias-p2140-v.nci.nih.gov"
        required: false
        type: boolean
        default: false

run-name: "${{ inputs.action == 'start' && 'Start' || inputs.action == 'restart' && 'Restart' || 'Stop' }} (DME ARCHIVAL WORKFLOW ${{ inputs.environment }})"

jobs:
  prepare:
    name: Prepare selected server matrix
    runs-on:
      group: cbiit-global-runners
      #labels: [self-hosted]
      #labels: [nonprod-org-runner]
      labels: [prod-org-runner]
    outputs:
      matrix: ${{ steps.selected_servers.outputs.matrix }}

    steps:  
      - name: Build selected server matrix
        id: selected_servers
        shell: bash
        run: |
          set -euo pipefail

          matrix='{"include":['
          separator=''

          add_server() {
            local name="$1"
            local host="$2"
            matrix="${matrix}${separator}{\"name\":\"${name}\",\"host\":\"${host}\"}"
            separator=','
          }

          if [ "${{ inputs.fsdmel_wflow02p_ncifcrf_gov }}" = "true" ]; then
            add_server "fsdmel-wflow02p.ncifcrf.gov" "fsdmel-wflow02p.ncifcrf.gov"
          fi
          if [ "${{ inputs.fsdmel_wflow03p_ncifcrf_gov }}" = "true" ]; then
            add_server "fsdmel-wflow03p.ncifcrf.gov" "fsdmel-wflow03p.ncifcrf.gov"
          fi
          if [ "${{ inputs.fsdmel_wflow04p_ncifcrf_gov }}" = "true" ]; then
            add_server "fsdmel-wflow04p.ncifcrf.gov" "fsdmel-wflow04p.ncifcrf.gov"
          fi

          if [ "${{ inputs.fsdmel_wflow05p_ncifcrf_gov }}" = "true" ]; then
            add_server "fsdmel-wflow05p.ncifcrf.gov" "fsdmel-wflow05p.ncifcrf.gov"
          fi

          if [ "${{ inputs.ncias_p2140_v_nci_nih_gov }}" = "true" ]; then
            add_server "ncias-p2140-v.nci.nih.gov" "ncias-p2140-v.nci.nih.gov"
          fi

          matrix="${matrix}]}"

          if [ "$matrix" = '{"include":[]}' ]; then
            echo "Select at least one deployment server checkbox." >&2
            exit 1
          fi

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Selected server matrix: ${matrix}"

  control_actions:        
    name: ${{ inputs.action == 'start' && 'Start' || inputs.action == 'restart' && 'Restart' || 'Stop' }} DME ARCHIVAL WORKFLOW on ${{ matrix.name }} 
    needs: prepare
    runs-on:
      group: cbiit-global-runners
      #labels: [self-hosted]
      #labels: [nonprod-org-runner]
      labels: [prod-org-runner]
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SERVICE_NAME: archival-workflow.service
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      RUNNER_SSH_USER: githubuser
    steps:
      - name: Set up SSH
        shell: bash
        run: |
          set -euo pipefail

          target_host="${{ matrix.host }}"

          if [ -z "${SSH_USER:-}" ]; then
            echo "DEPLOY_SSH_USER secret is required." >&2
            exit 1
          fi

          echo "Target host: ${target_host}"
          echo "Remote deploy user: ${SSH_USER}"
          echo "Runner SSH user: ${RUNNER_SSH_USER}"

          #sudo -iu "$RUNNER_SSH_USER" bash -lc 'mkdir -p ~/.ssh && chmod 700 ~/.ssh'

          #echo "Scanning host key for ${target_host}..."
          #sudo -iu "$RUNNER_SSH_USER" bash -lc "ssh-keyscan -T 15 -H '$target_host' >> ~/.ssh/known_hosts"

          #echo "Testing SSH connection as ${RUNNER_SSH_USER}..."
          sudo -iu "$RUNNER_SSH_USER" ssh -i"/home/${RUNNER_SSH_USER}/.ssh/id_rsa" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no \
            "${SSH_USER}@${target_host}" \
            "echo SSH connection OK"
          #ssh -vvv -4 -i"/home/${RUNNER_SSH_USER}/.ssh/id_ecdsa" \
            #-o IdentitiesOnly=yes \
            #-o BatchMode=yes \
            #-o ConnectTimeout=15 \
            #-o StrictHostKeyChecking=no \
            #hpcdm-wf-svc@fsdmel-wflow05p.ncifcrf.gov \
            #"echo SSH connection OK"

      - name: Stop service
        if: inputs.action == 'stop' || inputs.action == 'restart'
        shell: bash
        run: |
          set -euo pipefail

          target_host="${{ matrix.host }}"

          sudo -iu "$RUNNER_SSH_USER" ssh -o IdentitiesOnly=yes "${SSH_USER}@${target_host}" \
            "set -e; sudo systemctl stop ${SERVICE_NAME}; echo "Service stopped on ${target_host}."

      - name: Start service
        if: inputs.action == 'start' || inputs.action == 'restart'
        shell: bash
        run: |
          set -euo pipefail

          target_host="${{ matrix.host }}"

          sudo -iu "$RUNNER_SSH_USER" ssh -o IdentitiesOnly=yes "${SSH_USER}@${target_host}" \
            "set -e; sudo systemctl start ${SERVICE_NAME}; echo 'Process check:'; ps -ef | grep -E '[d]me-sync|[a]rchival-workflow' || true; echo 'Service status:'; sudo systemctl status ${SERVICE_NAME} || true"
